name: Promote to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  promote:
    name: Activate prod workflow & deactivate dev workflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed workflow files
        id: changes
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          # On workflow_dispatch or first push, before may be empty/zeros
          if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
            changed=$(git ls-files 'workflows/*.json')
          else
            changed=$(git diff --name-only "$before" "${{ github.sha }}" -- 'workflows/*.json' || true)
          fi
          echo "Changed workflow files:"
          echo "$changed"
          # Store as a space-separated list for the next step
          {
            echo 'files<<EOF'
            echo "$changed"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Promote changed workflows
        if: steps.changes.outputs.files != ''
        env:
          N8N_PROD_URL: ${{ secrets.N8N_PROD_URL }}
          N8N_PROD_API_KEY: ${{ secrets.N8N_PROD_API_KEY }}
          N8N_DEV_URL: ${{ secrets.N8N_DEV_URL }}
          N8N_DEV_API_KEY: ${{ secrets.N8N_DEV_API_KEY }}
        run: |
          set -euo pipefail

          echo "${{ steps.changes.outputs.files }}" | while read -r file; do
            [ -z "$file" ] && continue

            workflow_id="$(basename "$file" .json)"
            echo "::group::Promoting workflow $workflow_id"

            # 1. Activate the workflow on the PRODUCTION instance
            echo "Activating $workflow_id on production..."
            curl --fail-with-body -s -X PATCH \
              "${N8N_PROD_URL}/api/v1/workflows/${workflow_id}" \
              -H "accept: application/json" \
              -H "Content-Type: application/json" \
              -H "X-N8N-API-KEY: ${N8N_PROD_API_KEY}" \
              -d '{"active": true}'

            # 2. Deactivate the workflow on the DEVELOP instance
            echo "Deactivating $workflow_id on develop..."
            curl --fail-with-body -s -X PATCH \
              "${N8N_DEV_URL}/api/v1/workflows/${workflow_id}" \
              -H "accept: application/json" \
              -H "Content-Type: application/json" \
              -H "X-N8N-API-KEY: ${N8N_DEV_API_KEY}" \
              -d '{"active": false}'

            # 3. Verify production is active
            prod_status=$(curl --fail-with-body -s \
              "${N8N_PROD_URL}/api/v1/workflows/${workflow_id}" \
              -H "accept: application/json" \
              -H "X-N8N-API-KEY: ${N8N_PROD_API_KEY}" \
              | jq -r '.active')
            echo "Production $workflow_id active: $prod_status"
            [ "$prod_status" = "true" ] || { echo "ERROR: production workflow $workflow_id is not active!"; exit 1; }

            # 4. Verify develop is inactive
            dev_status=$(curl --fail-with-body -s \
              "${N8N_DEV_URL}/api/v1/workflows/${workflow_id}" \
              -H "accept: application/json" \
              -H "X-N8N-API-KEY: ${N8N_DEV_API_KEY}" \
              | jq -r '.active')
            echo "Develop $workflow_id active: $dev_status"
            [ "$dev_status" = "false" ] || { echo "ERROR: develop workflow $workflow_id is still active!"; exit 1; }

            echo "Successfully promoted $workflow_id"
            echo "::endgroup::"
          done

      - name: No workflow changes
        if: steps.changes.outputs.files == ''
        run: echo "No workflow JSON files changed in this push - nothing to promote."
