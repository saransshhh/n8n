name: 1 - Ingress split (develop-sub -> develop)

# Splits raw n8n source-control pushes on develop-sub into one PR per workflow
# into the clean integration branch 'develop'. Each push creates a NEW PR per
# changed workflow using a unique branch name (auto/<id>-<short-sha>).
# Detects NEW vs UPDATE by checking if the file already exists on develop.

on:
  push:
    branches: [develop-sub]
    paths:
      - 'workflows/**'
      - 'tags.json'
      - 'credential_stubs/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ingress-split
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop-sub
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop

      - name: Create per-workflow PRs into develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          short_sha="${GITHUB_SHA::7}"
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ "$before" =~ ^0+$ ]] || [ -z "$before" ]; then
            changed_files=$(git diff --name-only origin/develop -- 'workflows/*.json')
          else
            changed_files=$(git diff --name-only "$before" "$after" -- 'workflows/*.json')
          fi
          if [ -z "$changed_files" ]; then
            echo "No workflow changes in this push"; exit 0
          fi
          echo "$changed_files" | while read -r file; do
            [ -z "$file" ] && continue
            workflow_id="$(basename "$file" .json)"
            branch="auto/${workflow_id}-${short_sha}"
            last_sha=$(git log -1 --format='%H' develop-sub -- "$file")
            pusher_name=$(git log -1 --format='%an' "$last_sha")
            pusher_email=$(git log -1 --format='%ae' "$last_sha")
            commit_msg=$(git log -1 --format='%s' "$last_sha")
            if git cat-file -e "origin/develop:$file" 2>/dev/null; then
              change_type="UPDATE"
            else
              change_type="NEW"
            fi
            git checkout -B "$branch" origin/develop
            git checkout develop-sub -- "$file"
            workflow_name="$(jq -r '.name // empty' "$file")"
            [ -z "$workflow_name" ] && workflow_name="$workflow_id"
            node_count="$(jq '.nodes | length' "$file" 2>/dev/null || echo unknown)"
            git add "$file"
            git config user.name "$pusher_name"
            git config user.email "$pusher_email"
            if git diff --cached --quiet; then
              has_diff="no"
              git commit -m "${change_type} workflow: ${workflow_name} (${short_sha}) [no content change]" --allow-empty
            else
              has_diff="yes"
              git commit -m "${change_type} workflow: ${workflow_name} (${short_sha})"
            fi
            git push -f origin "$branch"
            body="$(printf '## %s: %s\n**Pushed by:** %s\n**Commit:** %s\n**Source SHA:** %s\n**File:** %s\n**Nodes:** %s\n**Content changed vs develop:** %s\n\n---\n_Auto-generated PR: develop-sub -> develop. Merging overlays the pushed version onto develop._' "$change_type" "$workflow_name" "$pusher_name" "$commit_msg" "$short_sha" "$file" "$node_count" "$has_diff")"
            gh pr create --title "${change_type}: ${workflow_name} (${short_sha})" --body "$body" \
              --base develop --head "$branch" || echo "PR create failed for $branch"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout develop-sub
          done

      - name: Sync tags.json into develop via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          short_sha="${GITHUB_SHA::7}"
          git fetch origin develop
          tags_branch="auto/tags-sync-${short_sha}"
          git checkout -B "$tags_branch" origin/develop
          git checkout develop-sub -- tags.json || exit 0
          git add tags.json
          git diff --cached --quiet && echo "No tags changes" && exit 0
          git commit -m "Sync tags.json (${short_sha})"
          git push -f origin "$tags_branch"
          gh pr create --title "Sync: tags.json (${short_sha})" --body "Auto-sync tags metadata from develop-sub" \
            --base develop --head "$tags_branch" || echo "tags PR create failed"
